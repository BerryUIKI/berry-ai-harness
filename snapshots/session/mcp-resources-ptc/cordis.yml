- insert:
    - id: mcp-resource-catalog
      name: '@berry-ai/harness-mcp-client'
      config:
        transport: stdio
        serverName: catalog
        command: !!js process.execPath
        args: !!js '[process.env.DSH_MCP_RESOURCES_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false

- id: tools
  name: '@berry-ai/harness-tools'
  config:
    mode: ptc
