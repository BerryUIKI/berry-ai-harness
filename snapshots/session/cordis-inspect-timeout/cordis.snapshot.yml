- id: llm-deepseek
  name: '@berry-ai/harness-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@berry-ai/harness-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@berry-ai/harness-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@berry-ai/harness-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@berry-ai/harness-tools'
  config:
    mode: native

- id: system-prompt
  name: '@berry-ai/harness-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@berry-ai/harness-cordis-host-runner'
      config:
        clientInspectTimeoutMs: 100
    - id: cordis-inspect-providers
      name: '@berry-ai/harness-tool-cordis/host'
    - id: tool-cordis
      name: '@berry-ai/harness-tool-cordis'
    - id: llm-replay
      name: '@berry-ai/harness-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: client-inspect-timeout-fixture
      name: ./client-fixture.mjs
