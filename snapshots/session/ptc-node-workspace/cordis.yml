# PTC mode adds `ctx.ptcRuntime` and changes the registry to one wire tool,
# `run_code`, plus its generated TypeScript SDK prompt. The demo and snapshot
# recorder apply this profile patch; replay applies its sibling patch.
- insert:
    - id: literal-sdk
      name: '../../../packages/core/tools/tests/fixtures/literal-sdk.ts'

- id: agent-default-model
  name: '@berry-ai/harness-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@berry-ai/harness-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@berry-ai/harness-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@berry-ai/harness-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@berry-ai/harness-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
