# Keyless replay counterpart: deterministic HTTP remains real; only the model
# adapter is replaced by replay.
- id: llm-deepseek
  name: '@berry-ai/harness-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@berry-ai/harness-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: deepseek-fetch-fixture
      name: './deepseek-fetch-fixture.mjs'

- id: web
  name: '@berry-ai/harness-web'
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api

- id: web-deepseek-api
  name: '@berry-ai/harness-web-deepseek-api'
  config:
    fetchApiKeyEnv: DSH_SNAPSHOT_FETCH_KEY
    fetchBaseURL: http://127.0.0.1:43118/api/v1/tools

- id: tool-web
  name: '@berry-ai/harness-tool-web'
  config:
    search: false
