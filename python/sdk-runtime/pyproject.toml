[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "berry-ai-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled berry CLI runtime for the Berry AI Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Berry" }]

[project.urls]
Homepage = "https://github.com/BerryUIKI/berry-ai-harness"
Documentation = "https://github.com/BerryUIKI/berry-ai-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/BerryUIKI/berry-ai-harness/issues"
Source = "https://github.com/BerryUIKI/berry-ai-harness"

[project.scripts]
berry = "berry_ai_harness_runtime:main"
dsh = "berry_ai_harness_runtime:main"

# Include the injected berry executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/berry_ai_harness_runtime/runtime/berry-ai-harness-sdk-runtime-*",
  "src/berry_ai_harness_runtime/runtime/berry-ai-harness-sdk-runtime-*/**",
  "src/berry_ai_harness_runtime/runtime/deepseek-harness-sdk-runtime-*",
  "src/berry_ai_harness_runtime/runtime/deepseek-harness-sdk-runtime-*/**",
  "src/berry_ai_harness_runtime/runtime/linux-*/**",
  "src/berry_ai_harness_runtime/runtime/macos-*/**",
  "src/berry_ai_harness_runtime/runtime/win-*/**",
]
exclude = ["src/berry_ai_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/berry_ai_harness_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
