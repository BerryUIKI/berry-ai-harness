- name: '@berry-ai/harness-llm'
- name: '@berry-ai/harness-session'
- name: '@deepseek-ai/dsh-session-projection'
- name: '@berry-ai/harness-system-prompt'
- name: '@berry-ai/harness-tools'
- name: '@berry-ai/harness-agent'
- name: '@berry-ai/harness-agent-loop'
  config:
    agents: []
- name: '@berry-ai/harness-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@berry-ai/harness-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@berry-ai/harness-llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
