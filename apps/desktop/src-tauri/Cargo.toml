[package]
name = "berry-desktop"
version = "0.2.1-alpha.2"
description = "Berry AI Harness Tauri native desktop shell"
authors = ["BerryUIKI"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "image-ico", "image-png", "unstable"] }
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
